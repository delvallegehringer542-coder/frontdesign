<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二课：CSS 核心基础与球星卡片实战</title>
  <style>
    /* ========================================================
       1. 全局重置与推荐标配
       box-sizing: border-box 让 padding 和 border 不会把宽度撑大！
       ======================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1d13; /* 波士顿凯尔特人深绿夜色 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333333;
      
      /* Flexbox 经典用法：让整个卡片在屏幕正中央垂直+水平居中 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* ========================================================
       2. 盒模型核心：卡片容器
       - width: 宽度
       - padding: 内边距（卡片内容距离卡片边缘的呼吸空间）
       - border: 边框
       - border-radius: 圆角
       - box-shadow: 阴影立体感
       ======================================================== */
    .player-card {
      width: 360px;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      border: 2px solid #008348; /* 凯尔特人标志绿 */
      
      /* 卡片内部也用 Flex 进行垂直排列 */
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 鼠标悬停（Hover 伪类）：悬浮动效 */
    .player-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(0, 131, 72, 0.45);
    }

    /* 头像样式 */
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%; /* 50% 变成正圆形 */
      object-fit: cover;
      background-color: #f0f4f1;
      border: 3px solid #ffd700; /* 金色边框 */
      margin-bottom: 16px; /* 下外边距：推开下方的文字 */
    }

    /* 球员姓名 */
    .player-name {
      font-size: 24px;
      font-weight: 700;
      color: #008348;
      margin-bottom: 4px;
    }

    /* 球队与号码标签 */
    .player-tag {
      font-size: 14px;
      color: #666;
      background-color: #eaf5ee;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    /* ========================================================
       3. Flexbox 经典应用：数据面板横向排列
       ======================================================== */
    .stats-container {
      display: flex;
      justify-content: space-around; /* 平分空间，左右留白 */
      width: 100%;
      background: #f8faf9;
      border-radius: 12px;
      padding: 12px 8px;
      margin-bottom: 20px;
    }

    .stat-item {
      display: flex;
      flex-direction: column; /* 数字在上，标签在下 */
      align-items: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #111;
    }

    .stat-label {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    /* 互动按钮 */
    .btn-fan {
      width: 100%;
      padding: 12px;
      background-color: #008348;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-fan:hover {
      background-color: #006035;
    }

    .btn-fan:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- 球星卡片组件 -->
  <div class="player-card">
    <img class="avatar" src="https://cdn.nba.com/headshots/nba/latest/1040x760/1627759.png" alt="Jaylen Brown">
    
    <h2 class="player-name">Jaylen Brown</h2>
    <div class="player-tag">Boston Celtics · #7 · FMVP</div>

    <!-- 数据栏：使用 Flexbox 横向排开 -->
    <div class="stats-container">
      <div class="stat-item">
        <span class="stat-value">23.0</span>
        <span class="stat-label">场均得分</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">5.5</span>
        <span class="stat-label">场均篮板</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">3.6</span>
        <span class="stat-label">场均助攻</span>
      </div>
    </div>

    <!-- 点赞按钮 -->
    <button class="btn-fan" onclick="cheer()">🔥 为 FMVP 点赞 (<span id="likes">107</span>)</button>
  </div>

  <script>
    let count = 107;
    function cheer() {
      count++;
      document.getElementById('likes').innerText = count;
    }
  </script>
</body>
</html>
