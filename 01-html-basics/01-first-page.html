<!DOCTYPE html>
<!-- 1. lang="zh-CN" 告诉浏览器这个网页是中文内容 -->
<html lang="zh-CN">
  <head>
    <!-- 2. charset="UTF-8" 编码格式，保证中文不会出现乱码 -->
    <meta charset="UTF-8" />
    <!-- 3. viewport 让网页能够自适应手机和电脑屏幕大小 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 4. 网页标题：根据学习顺序规范命名 -->
    <title>Day 01 - HTML 基础骨架与初体验</title>
  </head>

  <!-- 5. 网页主体视觉内容 -->
  <body>
    <!-- 一级大标题 -->
    <h1>🚀 Day 01：开启前端之旅 —— 网页骨架与基础标签</h1>

    <!-- 普通文本段落 -->
    <p>
      你好！我是正在从零学习前端的新手。今天是
      <strong>Day 1</strong>，我已经掌握了 HTML 的基本骨架！
    </p>

    <hr />

    <!-- 二级小标题 -->
    <h2>⭐ 今日掌握的核心概念</h2>
    <p>前端主要由三大技术基石组成：</p>

    <!-- 无序列表 -->
    <ul>
      <li><strong>HTML</strong>：搭建页面的骨架结构（毛坯房）</li>
      <li><strong>CSS</strong>：负责排版与美化页面（精装修）</li>
      <li><strong>JavaScript</strong>：让页面产生动态交互（智能化大脑）</li>
    </ul>

    <!-- 交互按钮 -->
    <button onclick="alert('恭喜你，第一天打卡成功！🎉')">
      点我测试交互效果！
    </button>

    <br /><br />

    <!-- 超链接 -->
    <a href="https://developer.mozilla.org/zh-CN/docs/Web/HTML" target="_blank">
      👉 点击查阅 MDN 官方权威 HTML 教程
    </a>
  </body>
</html>
